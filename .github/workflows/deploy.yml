name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

# Разрешения, которых требует официальный деплой Pages через Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: важен только последний коммит.
# cancel-in-progress: false — уже начавшийся деплой доводим до конца, чтобы не оставить Pages в полурабочем состоянии.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Собираем только ветку по умолчанию — так workflow переживёт её переименование.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm run build — это tsc --noEmit + vite build, так что типы проверяются здесь же.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
